name: paa-company
services:
  redis:
    image: redis:7.4.2-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 2s
      retries: 10
    restart: unless-stopped
  postgres:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paa_company}
      POSTGRES_USER: ${POSTGRES_USER:-paa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command:
      [
        'postgres',
        '-c',
        'shared_buffers=${PAA_POSTGRES_SHARED_BUFFERS:-64MB}',
        '-c',
        'max_connections=${PAA_POSTGRES_MAX_CONNECTIONS:-20}',
      ]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  migrate:
    build: { context: ../.., dockerfile: deploy/company/Dockerfile, target: service }
    env_file: ../../apps/server/.env.web
    environment: &service-env
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-paa}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-paa_company}
      PAA_MEDIA_DIR: /data/media
      PAA_FFMPEG: ffmpeg
      PAA_REPLY_STREAM_REDIS_URL: redis://redis:6379/0
      PAA_COOKIE_SECURE: 'true'
      PAA_MODEL_KEY_FILE: /run/paa/model-master.key
    command: ['python', '-m', 'app.cli', 'migrate']
    depends_on: { postgres: { condition: service_healthy } }
  api:
    build: { context: ../.., dockerfile: deploy/company/Dockerfile, target: service }
    env_file: ../../apps/server/.env.web
    environment:
      <<: *service-env
      # Only the dedicated Caddy address may supply client IP/protocol headers.
      FORWARDED_ALLOW_IPS: ${PAA_PROXY_IP:-172.30.254.2}
    networks: [default, proxy]
    volumes:
      - media:/data/media
      - type: bind
        source: ${PAA_MODEL_KEY_HOST_PATH:?Set the existing private master key file}
        target: /run/paa/model-master.key
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    restart: unless-stopped
  worker:
    build: { context: ../.., dockerfile: deploy/company/Dockerfile, target: worker }
    cpus: ${PAA_WORKER_CPUS:-2.0}
    mem_limit: ${PAA_WORKER_MEMORY:-3g}
    memswap_limit: ${PAA_WORKER_MEMORY:-3g}
    env_file: ../../apps/server/.env.web
    environment: *service-env
    command: ['python', '-m', 'app.worker']
    stop_grace_period: 20s
    volumes:
      - media:/data/media
      - type: bind
        source: ${PAA_MODEL_KEY_HOST_PATH:?Set the existing private master key file}
        target: /run/paa/model-master.key
        read_only: true
        bind: { create_host_path: false }
    depends_on:
      {
        migrate: { condition: service_completed_successfully },
        redis: { condition: service_healthy },
      }
    restart: unless-stopped
  sandbox:
    profiles: [sandbox]
    build: { context: ../.., dockerfile: deploy/company/Dockerfile.sandbox, target: control }
    environment:
      SANDBOX_TOKEN: ${PAA_SANDBOX_TOKEN:-}
      SANDBOX_IMAGE: ${PAA_SANDBOX_RUNNER_IMAGE:-noria-sandbox-runner:local}
      SANDBOX_CONCURRENCY: ${SANDBOX_CONCURRENCY:-1}
      SANDBOX_MEMORY_MIB: ${SANDBOX_MEMORY_MIB:-1024}
      SANDBOX_CPUS: ${SANDBOX_CPUS:-1}
      SANDBOX_TIMEOUT_SECONDS: ${SANDBOX_TIMEOUT_SECONDS:-60}
    cpus: 0.5
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 64
    read_only: true
    tmpfs: [/tmp:size=32m]
    volumes:
      - sandbox_state:/state
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import os,urllib.request; urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8010/health",headers={"Authorization":"Bearer "+os.environ["SANDBOX_TOKEN"]}),timeout=5)',
        ]
      interval: 15s
      timeout: 8s
      retries: 3
    restart: unless-stopped
  web:
    build: { context: ../.., dockerfile: deploy/company/Dockerfile, target: web }
    environment: { PAA_DOMAIN: '${PAA_DOMAIN:?Set public domain or IP}' }
    ports: ['80:80', '443:443']
    networks:
      proxy:
        ipv4_address: ${PAA_PROXY_IP:-172.30.254.2}
    volumes: [caddy_data:/data, caddy_config:/config]
    depends_on: [api]
    restart: unless-stopped
networks:
  proxy:
    ipam:
      config:
        - subnet: ${PAA_PROXY_SUBNET:-172.30.254.0/29}
volumes:
  sandbox_state:
  pgdata:
  media:
  caddy_data:
  caddy_config:
