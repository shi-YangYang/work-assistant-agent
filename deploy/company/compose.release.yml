# release.sh builds first, then pins local image IDs in .release.env.
services:
  migrate:
    build: !reset null
    image: ${PAA_SERVICE_IMAGE:?Missing service image ID}
    pull_policy: never
  api:
    build: !reset null
    image: ${PAA_SERVICE_IMAGE:?Missing service image ID}
    pull_policy: never
  worker:
    build: !reset null
    image: ${PAA_WORKER_IMAGE:?Missing worker image ID}
    pull_policy: never
  sandbox:
    build: !reset null
    image: ${PAA_SANDBOX_CONTROL_IMAGE:-noria-sandbox-control:local}
    pull_policy: never
  web:
    build: !reset null
    image: ${PAA_WEB_IMAGE:?Missing web image ID}
    pull_policy: never
