name: paa-company
services:
  postgres:
    image: postgres:17.11-bookworm
    container_name: paa-company-postgres
    env_file: ../../.env.company
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paa_company}
      POSTGRES_USER: ${POSTGRES_USER:-paa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=20']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
    name: paa_company_pgdata
