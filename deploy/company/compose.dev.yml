name: paa-company
services:
  redis:
    image: redis:7.4.2-alpine
    command:
      [
        'redis-server',
        '--save',
        '',
        '--appendonly',
        'no',
        '--maxmemory',
        '64mb',
        '--maxmemory-policy',
        'noeviction',
      ]
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 2s
      retries: 10
    ports: ['127.0.0.1:${PAA_LOCAL_REDIS_PORT:-6379}:6379']
    networks: [business]
  postgres:
    image: ${PAA_LOCAL_POSTGRES_IMAGE:-postgres:17.11-bookworm}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paa_company}
      POSTGRES_USER: ${POSTGRES_USER:-paa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ['127.0.0.1:${PAA_LOCAL_POSTGRES_PORT:-5432}:5432']
    networks: [business]
    volumes: [pgdata:/var/lib/postgresql/data]
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=20']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
    name: ${PAA_LOCAL_PG_VOLUME:-paa_company_pgdata}
networks:
  business:
