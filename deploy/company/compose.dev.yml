name: paa-company
services:
  redis:
    image: redis:7.4.2-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no', '--maxmemory', '64mb', '--maxmemory-policy', 'noeviction']
    mem_limit: 128m
    memswap_limit: 128m
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 2s
      retries: 10
    container_name: paa-company-reply-redis
    ports: ['127.0.0.1:6379:6379']
  postgres:
    image: postgres:17.11-bookworm
    container_name: paa-company-postgres
    env_file: ../../apps/server/.env.web
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-paa_company}
      POSTGRES_USER: ${POSTGRES_USER:-paa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    command: ['postgres', '-c', 'shared_buffers=64MB', '-c', 'max_connections=20']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
    name: paa_company_pgdata
