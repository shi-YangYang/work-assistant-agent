[project]
name = "paa-core"
version = "0.1.0"
description = "Local recording and storage core for Personal Agent Assistant"
requires-python = ">=3.12,<3.13"
dependencies = ["sounddevice==0.5.6"]

[tool.paa]
entry-point = "src/python/paa_core/__main__.py"
test-command = "python -m unittest discover -s tests/python -v"
