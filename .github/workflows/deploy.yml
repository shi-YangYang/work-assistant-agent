name: Deploy Company Web

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full main commit SHA (empty uses main at dispatch time)
        required: false
        type: string
      mode:
        description: Server HTTPS configuration (certificate must be prepared for ip)
        type: choice
        options: [domain, ip]
        default: domain

permissions:
  contents: read

concurrency:
  group: company-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require a manual run from main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          IS_FORK: ${{ github.event.repository.fork }}
        run: |
          test "$EVENT" = workflow_dispatch
          test "$REF" = refs/heads/main
          test "$IS_FORK" = false
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the selected main revision
        env:
          REQUESTED_COMMIT: ${{ inputs.commit }}
          DISPATCH_COMMIT: ${{ github.sha }}
        run: |
          sha=${REQUESTED_COMMIT:-$DISPATCH_COMMIT}
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]] || { echo 'Use a full lowercase commit SHA'; exit 1; }
          git cat-file -e "$sha^{commit}"
          git merge-base --is-ancestor "$sha" "$DISPATCH_COMMIT"
          git cat-file -e "$sha:deploy/company/build.sh" || { echo 'Select a revision that supports server builds'; exit 1; }
          echo "RELEASE_ID=$sha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          # Only tracked source files; no checkout credentials, ignored data or environment files.
          mkdir "$RUNNER_TEMP/company-source"
          git archive "$sha" | tar -xf - -C "$RUNNER_TEMP/company-source"
      - name: Upload source, build on server and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: '22'
          DEPLOY_PATH: /srv/work-assistant-agent
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_MODE: ${{ inputs.mode }}
        run: |
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$DEPLOY_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]{1,5}$ ]] && (( 10#$DEPLOY_PORT > 0 && 10#$DEPLOY_PORT < 65536 ))
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_/-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "$RELEASE_ID" =~ ^[a-f0-9]{40}-[0-9]+-[0-9]+$ ]]
          [[ "$DEPLOY_MODE" == domain || "$DEPLOY_MODE" == ip ]]
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          umask 077
          key="$RUNNER_TEMP/deploy-key"
          hosts="$RUNNER_TEMP/deploy-known-hosts"
          printf '%s\n' "$SSH_KEY" > "$key"
          printf '%s\n' "$KNOWN_HOSTS" > "$hosts"
          trap 'rm -f "$key" "$hosts"' EXIT
          options=(-i "$key" -o "UserKnownHostsFile=$hosts" -o StrictHostKeyChecking=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3)
          target="$DEPLOY_USER@$DEPLOY_HOST"
          directory="$DEPLOY_PATH/releases/$RELEASE_ID"
          bash deploy/company/upload.sh "$RUNNER_TEMP/company-source" "$target" "$DEPLOY_PATH" "$RELEASE_ID" "${options[@]}" -p "$DEPLOY_PORT"
          echo 'Building images and deploying on the server'
          ssh "${options[@]}" -p "$DEPLOY_PORT" "$target" \
            "timeout --signal=TERM --kill-after=30s 50m bash '$directory/deploy/company/release.sh' '$DEPLOY_PATH' '$RELEASE_ID' '$DEPLOY_MODE'"
          printf '### Deployment complete\n\nRelease: `%s`\n\nMode: `%s`\n' "$RELEASE_ID" "$DEPLOY_MODE" >> "$GITHUB_STEP_SUMMARY"
