name: Desktop CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      checks:
        description: Checks to run on macOS and Windows
        type: choice
        options: [quick, desktop, asr, package, full]
        default: quick

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        # PRs use one reference environment; manual runs and release tags cover both platforms.
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["macos-15"]' || '["macos-15", "windows-2025"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m venv .venv
      - run: npm ci
        id: dependencies
      - run: node scripts/install-python.mjs
        id: runtime
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run format:check
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run test:unit
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run test:python
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
      - run: npm run build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}

  desktop:
    if: ${{ github.event_name == 'push' || inputs.checks == 'desktop' || inputs.checks == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m venv .venv
      - run: npm ci
      - run: node scripts/install-python.mjs
      - run: npm run test:smoke:quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: |
            artifacts/playwright/
            artifacts/spec002/*.png
          if-no-files-found: ignore

  integration:
    if: ${{ github.event_name == 'push' || inputs.checks == 'asr' || inputs.checks == 'package' || inputs.checks == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m venv .venv
      - run: npm ci
      - run: node scripts/install-python.mjs
      - uses: actions/cache@v4
        with:
          path: artifacts/spec003/real-asr/models
          key: whisper-small-${{ runner.os }}-${{ runner.arch }}-536b0662742c02347bc0e980a01041f333bce120
      # The frozen-runtime check also consumes this validated model/audio fixture.
      - run: npm run test:asr
        id: fixture
      - run: npm run test:smoke:asr
        if: ${{ github.event_name == 'push' || inputs.checks == 'asr' || inputs.checks == 'full' }}
        env:
          PAA_REAL_ASR_SMOKE: '1'
      - name: Install frozen-runtime build tools
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && (github.event_name == 'push' || inputs.checks == 'package' || inputs.checks == 'full') }}
        run: node scripts/install-build-python.mjs
        id: build-tools
      - run: npm run package
        if: ${{ !cancelled() && steps.build-tools.outcome == 'success' }}
        id: package
      - run: npm run test:package
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
      - name: Verify installed package
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: npx playwright test tests/smoke/package.spec.ts --output=artifacts/playwright-package
        env:
          PAA_PACKAGE_SMOKE: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.os }}
          path: |
            artifacts/playwright/
            artifacts/playwright-package/
            artifacts/spec003/*.json
            artifacts/spec003/*.png
            artifacts/spec005/*.json
            artifacts/spec005/*.png
          if-no-files-found: ignore

  required:
    name: CI required
    if: always()
    needs: [checks, desktop, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the results of required suites
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
          DESKTOP_REQUIRED: ${{ github.event_name == 'push' || inputs.checks == 'desktop' || inputs.checks == 'full' }}
          INTEGRATION_REQUIRED: ${{ github.event_name == 'push' || inputs.checks == 'asr' || inputs.checks == 'package' || inputs.checks == 'full' }}
        run: |
          node <<'JS'
          const jobs = JSON.parse(process.env.CHECK_RESULTS)
          const expected = {
            checks: 'success',
            desktop: process.env.DESKTOP_REQUIRED === 'true' ? 'success' : 'skipped',
            integration: process.env.INTEGRATION_REQUIRED === 'true' ? 'success' : 'skipped',
          }
          for (const [name, result] of Object.entries(expected)) {
            console.log(`${name}: ${jobs[name]?.result} (expected ${result})`)
            if (jobs[name]?.result !== result) process.exitCode = 1
          }
          JS
