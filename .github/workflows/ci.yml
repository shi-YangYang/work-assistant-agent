name: Project CI

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      checks:
        description: Stage to run
        type: choice
        options: [quick, desktop, asr, package]
        default: quick
      platform:
        description: Platform for manual runtime checks
        type: choice
        options: [macos-15, windows-2025]
        default: macos-15

permissions:
  contents: read
concurrency:
  group: project-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.checks == 'quick' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      # Keep dependency install scripts (esbuild/native initialization), but skip
      # downloading Electron: ordinary bundling never launches the runtime.
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run typecheck:web
      - name: Python syntax without imports or runtime dependencies
        run: python scripts/testing/python-syntax.py
      - run: npm run build
      - run: npm run build:web

  desktop:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'desktop' }}
    strategy:
      fail-fast: false
      matrix:
        os: ['${{ inputs.platform }}']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/desktop/core/requirements.lock
      - run: python -m venv .venv
      - run: npm ci
      - run: node scripts/desktop/install-python.mjs
      - run: npm run test:smoke:quick
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-smoke-${{ matrix.os }}
          path: |
            artifacts/playwright/
            artifacts/spec002/*.png
          if-no-files-found: ignore

  integration:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'asr' || inputs.checks == 'package') }}
    strategy:
      fail-fast: false
      matrix:
        os: ['${{ inputs.platform }}']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/desktop/core/requirements.lock
      - run: python -m venv .venv
      - run: npm ci
      - run: node scripts/desktop/install-python.mjs
      - uses: actions/cache@v4
        with:
          path: artifacts/spec003/real-asr/models
          key: whisper-small-${{ runner.os }}-${{ runner.arch }}-536b0662742c02347bc0e980a01041f333bce120
      # The frozen-runtime check also consumes this validated model/audio fixture.
      - run: npm run test:asr
        id: fixture
      - run: npm run test:smoke:asr
        if: ${{ inputs.checks == 'asr' }}
        env:
          PAA_REAL_ASR_SMOKE: '1'
      - name: Install frozen-runtime build tools
        if: ${{ !cancelled() && steps.fixture.outcome == 'success' && (inputs.checks == 'package') }}
        run: node scripts/desktop/install-build-python.mjs
        id: build-tools
      - run: npm run package
        if: ${{ !cancelled() && steps.build-tools.outcome == 'success' }}
        id: package
      - run: npm run test:package
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
      - name: Verify installed package
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        run: npx playwright test --config apps/desktop/playwright.config.ts tests/e2e/desktop/package.spec.ts --output=artifacts/playwright-package
        env:
          PAA_PACKAGE_SMOKE: '1'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.package.outcome == 'success' }}
        with:
          name: package-${{ matrix.os }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-${{ matrix.os }}
          path: |
            artifacts/playwright/
            artifacts/playwright-package/
            artifacts/spec003/*.json
            artifacts/spec003/*.png
            artifacts/spec005/*.json
            artifacts/spec005/*.png
          if-no-files-found: ignore

  required:
    name: CI required
    if: always()
    needs: [checks, desktop, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the results of required suites
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_CHECKS: ${{ inputs.checks }}
          SELECTED_PLATFORM: ${{ inputs.platform }}
          CHECKS_REQUIRED: ${{ github.event_name != 'workflow_dispatch' || inputs.checks == 'quick' }}
          CHECK_RESULTS: ${{ toJSON(needs) }}
          DESKTOP_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && inputs.checks == 'desktop' }}
          INTEGRATION_REQUIRED: ${{ github.event_name == 'workflow_dispatch' && (inputs.checks == 'asr' || inputs.checks == 'package') }}
        run: |
          node <<'JS'
          const event = process.env.EVENT_NAME
          const stage = process.env.SELECTED_CHECKS
          if (!['pull_request', 'push', 'workflow_dispatch'].includes(event)) process.exit(1)
          if (event === 'workflow_dispatch' && (!['quick', 'desktop', 'asr', 'package'].includes(stage) || !['macos-15', 'windows-2025'].includes(process.env.SELECTED_PLATFORM))) process.exit(1)
          const jobs = JSON.parse(process.env.CHECK_RESULTS)
          const expected = {
            checks: process.env.CHECKS_REQUIRED === 'true' ? 'success' : 'skipped',
            desktop: process.env.DESKTOP_REQUIRED === 'true' ? 'success' : 'skipped',
            integration: process.env.INTEGRATION_REQUIRED === 'true' ? 'success' : 'skipped',
          }
          for (const [name, result] of Object.entries(expected)) {
            console.log(`${name}: ${jobs[name]?.result} (expected ${result})`)
            if (jobs[name]?.result !== result) process.exitCode = 1
          }
          JS
