name: Desktop recording checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m venv .venv
      - run: npm ci
      - run: node scripts/install-python.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - uses: actions/cache@v4
        with:
          path: artifacts/spec003/real-asr/models
          key: whisper-small-${{ runner.os }}-536b0662742c02347bc0e980a01041f333bce120
      - run: npm run test:asr
      - run: npm run test:smoke
        env:
          PAA_REAL_ASR_SMOKE: '1'

      - name: Install frozen-runtime build tools
        run: node scripts/install-build-python.mjs
      - run: npm run package
      - run: npm run test:package
      - name: Verify installed package
        run: npx playwright test tests/smoke/package.spec.ts
        env:
          PAA_PACKAGE_SMOKE: '1'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            artifacts/playwright/
            artifacts/spec002/*.png
            artifacts/spec003/*.json
            artifacts/spec003/*.png
            artifacts/spec005/*.json
            artifacts/spec005/*.png
          if-no-files-found: ignore
