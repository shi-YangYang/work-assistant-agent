<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>个人工作助手 · Spec 006 交互原型</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #eef0f5;
        --sidebar: #f4f5f8;
        --surface: #fff;
        --subtle: #f7f8fb;
        --text: #202735;
        --muted: #606b7d;
        --line: #dfe3eb;
        --control: #7b8799;
        --accent: #345bd8;
        --accent-ink: #fff;
        --selection: #e9efff;
        --positive: #267252;
        --positive-bg: #e9f5ef;
        --danger: #b63243;
        --danger-bg: #fff0f2;
        --shadow: 0 12px 44px #14264b24;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --canvas: #0c1017;
        --sidebar: #10151e;
        --surface: #181e29;
        --subtle: #1e2634;
        --text: #eef1f7;
        --muted: #a5b0c3;
        --line: #364255;
        --control: #8a98b0;
        --accent: #9ab4ff;
        --accent-ink: #132044;
        --selection: #263957;
        --positive: #86d7b0;
        --positive-bg: #193d31;
        --danger: #ffa6b2;
        --danger-bg: #412630;
        --shadow: 0 12px 44px #0006;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font:
          14px/1.6 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }
      button,
      a,
      input,
      select {
        outline-offset: 4px;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--accent);
      }
      button {
        color: inherit;
      }
      svg {
        flex-shrink: 0;
        vertical-align: middle;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 25px;
        letter-spacing: -0.7px;
        line-height: 1.4;
        font-weight: 650;
      }
      h2 {
        font-size: 18px;
        line-height: 1.5;
        font-weight: 600;
      }
      h3 {
        font-size: 14px;
        font-weight: 600;
      }
      small,
      .small {
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .number {
        font-variant-numeric: tabular-nums;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .between {
        justify-content: space-between;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .spacer {
        flex: 1;
      }
      button {
        transition:
          background 0.14s,
          color 0.14s;
      }
      .btn {
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 7px;
        min-height: 34px;
        padding: 6px 12px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        white-space: nowrap;
      }
      .btn:hover {
        background: var(--subtle);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .btn.primary:hover {
        filter: brightness(0.96);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
      }
      .btn.ghost:hover {
        background: var(--subtle);
      }
      .btn.icon-only {
        padding: 7px;
        width: 34px;
      }
      .btn.danger {
        color: var(--danger);
      }
      .btn.small {
        min-height: 29px;
        padding: 3px 9px;
      }
      .review-bar {
        height: 42px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 0 20px;
        color: var(--muted);
        font-size: 12px;
        background: var(--canvas);
        border-bottom: 1px solid var(--line);
      }
      .review-bar strong {
        letter-spacing: 1.4px;
        color: var(--text);
        font-size: 11px;
      }
      .review-bar .btn {
        font-size: 12px;
        min-height: 26px;
        padding: 2px 8px;
      }
      .review-bar [aria-pressed='true'] {
        color: var(--accent);
        background: var(--selection);
      }
      .app {
        height: calc(100dvh - 42px);
        min-height: 598px;
        display: grid;
        grid-template-columns: 208px minmax(0, 1fr);
        background: var(--surface);
      }
      .sidebar {
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        padding: 23px 13px 16px;
        gap: 26px;
      }
      .brand {
        display: flex;
        align-items: center;
        padding: 0 9px;
        gap: 10px;
        font-weight: 650;
        letter-spacing: -0.2px;
      }
      .brand-mark {
        background: var(--accent);
        color: var(--accent-ink);
        width: 30px;
        height: 30px;
        border-radius: 9px;
        display: grid;
        place-items: center;
      }
      .nav-label {
        font-size: 11px;
        letter-spacing: 1px;
        color: var(--muted);
        padding: 0 11px;
        margin: 0 0 8px;
      }
      .nav-item {
        width: 100%;
        min-height: 38px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        padding: 8px 10px;
        display: flex;
        align-items: center;
        gap: 10px;
        text-align: left;
        font-size: 13px;
        margin: 3px 0;
      }
      .nav-item:hover {
        background: var(--subtle);
        color: var(--text);
      }
      .nav-item.active {
        background: var(--selection);
        color: var(--accent);
        font-weight: 600;
      }
      .nav-item .count {
        margin-left: auto;
        font-size: 11px;
      }
      .sidebar-bottom {
        margin-top: auto;
      }
      .sidebar-footer {
        padding: 14px 10px 0;
        border-top: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
        margin-top: 16px;
      }
      .main-shell {
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .topbar {
        height: 58px;
        min-height: 58px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 28px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
        color: var(--muted);
      }
      .topbar .location {
        color: var(--text);
      }
      .quick-search {
        gap: 24px;
        color: var(--muted);
        font-size: 12px;
        border-radius: 6px;
        padding: 5px 9px;
        min-height: 30px;
      }
      .key {
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 4px;
        font: 11px/1.6 inherit;
        color: var(--muted);
      }
      #content {
        flex: 1;
        min-height: 0;
        overflow: auto;
      }
      .page {
        padding: 34px 38px 42px;
        max-width: 1260px;
        margin: 0 auto;
      }
      .page-title {
        margin-bottom: 30px;
      }
      .page-title p {
        margin-top: 6px;
        color: var(--muted);
        font-size: 13px;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        font-size: 11px;
        font-weight: 500;
        border-radius: 5px;
        padding: 2px 7px;
        background: var(--subtle);
        color: var(--muted);
      }
      .status.ready {
        color: var(--positive);
        background: var(--positive-bg);
      }
      .status.processing {
        color: var(--accent);
        background: var(--selection);
      }
      .status.recording {
        color: var(--danger);
        background: var(--danger-bg);
      }
      .list-head {
        padding-bottom: 11px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 10px;
      }
      .list-head h2 {
        font-size: 13px;
      }
      .group-label {
        padding: 20px 8px 9px;
        color: var(--muted);
        font-size: 12px;
        font-weight: 500;
      }
      .meeting-row {
        width: 100%;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr) 78px 84px 18px;
        gap: 14px;
        align-items: center;
        text-align: left;
        background: transparent;
        border: 0;
        border-bottom: 1px solid var(--line);
        padding: 18px 8px;
        min-height: 85px;
      }
      .meeting-row:hover {
        background: var(--subtle);
      }
      .meeting-icon {
        color: var(--muted);
      }
      .meeting-row strong {
        display: block;
        font-size: 14px;
        font-weight: 550;
        line-height: 1.5;
      }
      .meeting-row small {
        display: block;
        color: var(--muted);
        margin-top: 5px;
        font-size: 12px;
      }
      .meeting-row .duration {
        font-size: 12px;
        color: var(--muted);
      }
      .meeting-row .arrow {
        color: var(--muted);
      }
      .list-bottom {
        display: flex;
        justify-content: space-between;
        margin-top: 23px;
        font-size: 12px;
        color: var(--muted);
      }
      .detail {
        padding: 28px 34px 32px;
        max-width: 1180px;
        margin: auto;
      }
      .detail-head {
        margin: 10px 0 12px;
      }
      .detail-chrome {
        position: sticky;
        top: 0;
        z-index: 2;
        background: var(--surface);
        padding: 10px 0 18px;
        margin-top: -10px;
      }
      .detail-chrome .tabs {
        margin-bottom: 0;
      }
      .quote,
      .transcript-line {
        scroll-margin-top: 210px;
      }
      .detail-head h1 {
        font-size: 24px;
        margin-top: 10px;
      }
      .meta-line {
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 15px;
        margin-top: 10px;
        flex-wrap: wrap;
      }
      .tabs {
        display: flex;
        gap: 24px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 30px;
      }
      .tab {
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        padding: 10px 1px;
        color: var(--muted);
        font-size: 13px;
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .tab.active {
        color: var(--accent);
        border-color: var(--accent);
        font-weight: 600;
      }
      .document-layout {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 28px;
      }
      .document-layout.has-source {
        grid-template-columns: minmax(0, 1fr) 270px;
      }
      .document {
        max-width: 740px;
        min-width: 0;
      }
      .document > section {
        margin-bottom: 28px;
      }
      .document h2 {
        font-size: 14px;
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 12px;
      }
      .document p {
        font-size: 14px;
        line-height: 1.95;
        color: var(--text);
      }
      .summary-intro {
        font-size: 16px !important;
        line-height: 1.9 !important;
      }
      .document ul {
        margin: 0;
        padding-left: 19px;
      }
      .document li {
        margin: 10px 0;
        line-height: 1.85;
      }
      .quote {
        border: 0;
        background: var(--selection);
        color: var(--accent);
        font-size: 11px;
        padding: 1px 5px;
        margin-left: 5px;
        border-radius: 4px;
        white-space: nowrap;
        vertical-align: baseline;
      }
      .action-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 50px 58px;
        gap: 12px;
        padding: 13px 0;
        border-bottom: 1px solid var(--line);
        align-items: center;
      }
      .action-row p {
        font-size: 13px;
      }
      .action-row small {
        font-size: 11px;
        color: var(--muted);
      }
      .section-eyebrow {
        font-size: 11px;
        letter-spacing: 1px;
        color: var(--muted);
        margin-bottom: 9px;
      }
      .source-pane {
        background: var(--subtle);
        border: 1px solid var(--line);
        padding: 18px;
        border-radius: 8px;
        align-self: start;
        min-width: 0;
      }
      .source-pane p {
        font-size: 13px;
        line-height: 1.9;
        margin: 16px 0;
      }
      .source-pane .source-line {
        border-left: 2px solid var(--accent);
        padding-left: 13px;
      }
      .source-pane .time {
        color: var(--accent);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .source-pane .btn {
        font-size: 12px;
      }
      .transcript-tools {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
        font-size: 12px;
      }
      .transcript-line {
        display: grid;
        grid-template-columns: 54px minmax(0, 1fr);
        gap: 16px;
        padding: 17px 12px;
        border-radius: 6px;
        line-height: 1.9;
        font-size: 14px;
      }
      .transcript-line.selected {
        background: var(--selection);
      }
      .timestamp {
        border: 0;
        background: transparent;
        padding: 0;
        color: var(--muted);
        align-self: start;
        text-align: left;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }
      .timestamp:hover {
        color: var(--accent);
      }
      .player {
        border-top: 1px solid var(--line);
        padding: 13px 28px 15px;
        background: var(--surface);
        flex-shrink: 0;
      }
      .player-track {
        display: flex;
        align-items: center;
        gap: 13px;
        color: var(--muted);
        font-size: 11px;
        margin-bottom: 9px;
      }
      .player input[type='range'] {
        accent-color: var(--accent);
        height: 4px;
        flex: 1;
        min-width: 40px;
      }
      .player-controls {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }
      .player .main-play {
        background: var(--accent);
        border: 0;
        color: var(--accent-ink);
        width: 34px;
        height: 34px;
        border-radius: 50%;
      }
      .player .track-title {
        font-size: 12px;
      }
      .player .volume {
        max-width: 84px;
      }
      .speed-wrap {
        position: relative;
      }
      .speed-menu {
        position: absolute;
        right: 0;
        bottom: calc(100% + 8px);
        min-width: 135px;
        background: var(--surface);
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        padding: 5px;
        border-radius: 8px;
        z-index: 5;
      }
      .speed-menu button {
        border: 0;
        background: transparent;
        display: block;
        width: 100%;
        text-align: left;
        padding: 8px 10px;
        border-radius: 4px;
        font-size: 12px;
      }
      .speed-menu button:hover {
        background: var(--selection);
        color: var(--accent);
      }
      .recordbar {
        background: var(--subtle);
        border-top: 1px solid var(--line);
        padding: 12px 26px;
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
        font-size: 12px;
      }
      .live-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--danger);
        display: inline-block;
        flex-shrink: 0;
      }
      .live-dot.paused {
        background: var(--muted);
      }
      .recordbar .btn {
        font-size: 12px;
      }
      .recordbar .record-title {
        font-weight: 550;
      }
      .live-heading {
        padding: 22px 0 25px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 28px;
      }
      .live-time {
        font-size: 35px;
        letter-spacing: -1.2px;
        line-height: 1.4;
        margin: 14px 0 7px;
      }
      .live-tools {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 22px;
      }
      .live-device {
        display: flex;
        gap: 7px;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      .listening {
        color: var(--muted);
        font-size: 12px;
        margin: 24px 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .settings-layout {
        display: grid;
        grid-template-columns: 190px minmax(0, 1fr);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .service-list {
        padding: 12px;
        background: var(--subtle);
        border-right: 1px solid var(--line);
      }
      .service-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        background: transparent;
        width: 100%;
        border: 1px solid transparent;
        border-radius: 6px;
        text-align: left;
        padding: 13px 10px;
        margin-bottom: 5px;
      }
      .service-item.active {
        background: var(--surface);
        border-color: var(--line);
      }
      .service-symbol {
        width: 28px;
        height: 28px;
        display: grid;
        place-items: center;
        border: 1px solid var(--line);
        border-radius: 7px;
        font-size: 12px;
        color: var(--accent);
        font-weight: 600;
        background: var(--surface);
      }
      .service-item strong {
        font-size: 12px;
        font-weight: 600;
      }
      .service-item small {
        display: block;
        margin-top: 3px;
        font-size: 11px;
        color: var(--muted);
      }
      .service-editor {
        padding: 25px 26px;
        min-width: 0;
      }
      .service-editor .tabs {
        margin-bottom: 22px;
        margin-top: 16px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 19px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
      }
      .field > span {
        font-weight: 550;
      }
      .field small {
        color: var(--muted);
        font-size: 11px;
      }
      .field input,
      .field select {
        width: 100%;
        min-width: 0;
        height: 37px;
        padding: 7px 10px;
        border: 1px solid var(--control);
        background: var(--surface);
        color: var(--text);
        border-radius: 6px;
        font-size: 13px;
      }
      .field input[readonly] {
        background: var(--subtle);
        border-color: var(--line);
      }
      .check-row {
        display: flex;
        gap: 9px;
        align-items: center;
        font-size: 13px;
      }
      .check-row input {
        accent-color: var(--accent);
        width: 15px;
        height: 15px;
      }
      .form-divider {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 24px 0;
      }
      .save-row {
        margin-top: 26px;
        padding-top: 20px;
        border-top: 1px solid var(--line);
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .feedback {
        font-size: 12px;
        color: var(--positive);
        min-height: 19px;
        margin-top: 14px;
      }
      .settings-intro {
        margin-bottom: 22px;
        color: var(--muted);
        font-size: 13px;
        line-height: 1.8;
      }
      .model-panel {
        max-width: 730px;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 24px;
        margin-top: 22px;
      }
      .model-panel h2 {
        font-size: 16px;
      }
      .settings-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 22px 0;
        border-bottom: 1px solid var(--line);
      }
      .settings-row p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
      }
      .theme-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        max-width: 820px;
        margin-top: 25px;
      }
      .theme-option {
        background: var(--surface);
        color: var(--text);
        padding: 0;
        text-align: left;
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      .theme-option.chosen {
        border: 2px solid var(--accent);
      }
      .theme-mini {
        height: 116px;
        display: grid;
        grid-template-columns: 28% 1fr;
        background: #fff;
        border-bottom: 1px solid #dfe3eb;
      }
      .theme-mini .mini-side {
        background: #f0f2f7;
        padding: 15px 8px;
      }
      .theme-mini .mini-main {
        padding: 18px 12px;
      }
      .mini-line {
        height: 5px;
        border-radius: 2px;
        background: #c8cfdc;
        margin: 9px 0;
      }
      .mini-line.active {
        background: #345bd8;
        width: 75%;
      }
      .mini-main .mini-line {
        background: #dce1eb;
      }
      .theme-mini.dark {
        background: #181e29;
        border-color: #364255;
      }
      .theme-mini.dark .mini-side {
        background: #10151e;
      }
      .theme-mini.dark .mini-line {

              '"><div class="theme-mini ' +
              value +
              '"><div class="mini-side"><div class="mini-line active"></div><div class="mini-line"></div><div class="mini-line"></div></div><div class="mini-main"><div class="mini-line" style="width:50%"></div><div class="mini-line"></div><div class="mini-line"></div></div></div><span class="theme-option-label"><span class="row">' +
              icon(symbol) +
              label +
              '</span><span class="icon">' +
              (state.theme === value ? icon('Check') : '') +
              '</span></span></button>',
          )
          .join('')
      }
      function commands() {
        return [
          { label: '打开会议记录', icon: 'AudioLines', page: 'list' },
          { label: '模型服务管理', icon: 'SlidersHorizontal', page: 'services' },
          { label: '本地转写模型', icon: 'Download', page: 'local' },
          { label: '更改外观', icon: 'Sun', page: 'appearance' },
          state.recording
            ? { label: '返回当前会议', icon: 'Mic', page: 'live' }
            : { label: '开始会议', icon: 'Plus', action: 'start' },
        ]
      }
      function renderCommands() {
        const q = $('#command-query').value.toLowerCase()
        $('#command-results').innerHTML =
          commands()
            .filter((c) => c.label.toLowerCase().includes(q))
            .map(
              (c) =>
                '<button class="command-result" data-action="' +
                (c.action || 'nav') +
                '" ' +
                (c.page ? 'data-page="' + c.page + '"' : '') +
                '>' +
                icon(c.icon) +
                c.label +
                '<span class="spacer"></span>' +
                icon('ChevronRight') +
                '</button>',
            )
            .join('') || '<p class="muted small" style="padding:16px">没有找到对应操作</p>'
      }
      function showCommand() {
        $('#command-query').value = ''
        renderCommands()
        $('#command-dialog').showModal()
        $('#command-query').focus()
      }
      function run(action, b) {
        if (action === 'nav') {
          navigate(b.dataset.page)
          return
        }
        if (action === 'theme') {
          setTheme(b.dataset.value)
          return
        }
        if (action === 'meeting') {
          state.meeting = Number(b.dataset.index)
          state.tab = 'minutes'
          state.time = 0
          navigate('detail')
          return
        }
        if (action === 'tab') {
          scrolls['detail:' + state.tab] = $('#content').scrollTop
          state.tab = b.dataset.value
          render()
          $('#content').scrollTop = scrolls['detail:' + state.tab] || 0
          return
        }
        if (action === 'source') {
          state.source = Number(b.dataset.time)
          renderSource()
          return
        }
        if (action === 'close-source') {
          const trigger = document.querySelector(
            '[data-action="source"][data-time="' + state.source + '"]',
          )
          $('#source-host').hidden = true
          $('#document-layout').classList.remove('has-source')
          state.source = null
          trigger?.focus()
          return
        }
        if (action === 'goto-source') {
          scrolls['detail:minutes'] = $('#content').scrollTop
          state.tab = 'transcript'
          render()
          $('#segment-' + state.source)?.scrollIntoView({ block: 'center', behavior: 'smooth' })
          return
        }
        if (action === 'source-play') {
          if (state.recording) {
            notice('录音期间暂停回放')
            return
          }
          state.time = Number(b.dataset.time)
          state.playing = true
          updatePlayer()
          return
        }
        if (action === 'play') {
          state.playing = !state.playing
          updatePlayer()
          return
        }
        if (action === 'seek') {
          state.time = Math.max(0, Math.min(2536, state.time + Number(b.dataset.offset)))
          updatePlayer()
          return
        }
        if (action === 'mute') {
          state.muted = !state.muted
          if ($('#volume')) $('#volume').value = state.muted ? '0' : '75'
          updatePlayer()
          return
        }
        if (action === 'speed-menu') {
          const menu = $('#speed-menu')
          menu.hidden = !menu.hidden
          $('#speed-button').setAttribute('aria-expanded', String(!menu.hidden))
          menu.innerHTML = [0.5, 0.75, 1, 1.25, 1.5, 2]
            .map(
              (n) =>
                '<button data-action="speed" data-value="' +
                n +
                '">' +
                n +
                '×' +
                (n === 1 ? ' · 正常速度' : '') +
                '</button>',
            )
            .join('')
          return
        }
        if (action === 'speed') {
          state.speed = Number(b.dataset.value)
          $('#speed-menu').hidden = true
          $('#speed-button').setAttribute('aria-expanded', 'false')
          updatePlayer()
          $('#speed-button').focus()
          return
        }
        if (action === 'start') {
          state.recording = true
          state.paused = false
          state.elapsed = 26
          state.playing = false
          navigate('live')
          return
        }
        if (action === 'pause') {
          state.paused = !state.paused
          if (state.page === 'live') renderLive()
          else renderRecordBar()
          return
        }
        if (action === 'end') {
          state.recording = false
          state.paused = false
          state.playing = false
          navigate('list')
          notice('示例录音已结束')
          return
        }
        if (action === 'service') {
          state.service = Number(b.dataset.index)
          renderServices()
          return
        }
        if (action === 'service-tab') {
          state.serviceTab = b.dataset.value
          renderServices()
          return
        }
        if (action === 'new-service') {
          services.push({
            name: '新服务',
            url: '',
            model: 'custom-model',
            preset: 'default',
            stream: true,
            presetName: '',
            effort: '',
          })
          state.service = services.length - 1
          state.serviceTab = 'connection'
          renderServices()
          return
        }
        if (action === 'save-service') {
          renderServices()
          $('#service-feedback').textContent = '更改已保留在本次预览中'
          return
        }
        if (action === 'activate-service') {
          state.activeService = state.service
          renderServices()
          return
        }
        if (action === 'check-service') {
          const service = state.service
          $('#service-feedback').textContent = '正在测试连接…'
          clearTimeout(checkTimer)
          checkTimer = setTimeout(() => {
            if (state.page === 'services' && state.service === service)
              $('#service-feedback').textContent = '连接成功 · 328 毫秒（示例）'
          }, 850)
          return
        }
        if (action === 'get-models') {
          $('#service-feedback').textContent = '模型列表已更新 · 3 个示例模型'
          return
        }
        if (action === 'command') {
          showCommand()
          return
        }
        if (action === 'close-command') {
          $('#command-dialog').close()
          return
        }
      }
      document.addEventListener('click', (event) => {
        const b = event.target.closest('[data-action]')
        if (b && !b.disabled) {
          if (b.closest('#command-results')) $('#command-dialog').close()
          run(b.dataset.action, b)
        }
        if (!event.target.closest('.speed-wrap') && $('#speed-menu')) {
          $('#speed-menu').hidden = true
          $('#speed-button').setAttribute('aria-expanded', 'false')
        }
      })
      document.addEventListener('input', (event) => {
        const el = event.target
        if (el.id === 'command-query') {
          renderCommands()
          return
        }
        if (el.id === 'timeline') {
          state.time = Number(el.value)
          updatePlayer()
          return
        }
        if (el.dataset.field) {
          services[state.service][el.dataset.field] = el.type === 'checkbox' ? el.checked : el.value
        }
        if (el.id === 'volume') {
          state.muted = Number(el.value) === 0
          updatePlayer()
        }
      })
      document.addEventListener('keydown', (event) => {
        const editable = event.target.closest('input,textarea,select,[contenteditable=true]')
        if ((event.metaKey || event.ctrlKey) && event.key.toLowerCase() === 'k' && !editable) {
          event.preventDefault()
          if ($('#command-dialog').open) $('#command-dialog').close()
          else showCommand()
        }
        if (event.key === 'Escape' && $('#speed-menu') && !$('#speed-menu').hidden) {
          $('#speed-menu').hidden = true
          $('#speed-button').setAttribute('aria-expanded', 'false')
          $('#speed-button').focus()
        }
        if ($('#command-dialog').open && ['ArrowDown', 'ArrowUp', 'Enter'].includes(event.key)) {
          const items = [...document.querySelectorAll('.command-result')]
          if (!items.length) return
          const i = items.indexOf(document.activeElement)
          if (event.key === 'Enter' && i < 0) {
            event.preventDefault()
            items[0].click()
          } else if (event.key !== 'Enter') {
            event.preventDefault()
            items[(i + (event.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length].focus()
          }
        }
        if (
          state.page === 'detail' &&
          !editable &&
          !event.target.closest('button,dialog') &&
          event.code === 'Space'
        ) {
          event.preventDefault()
          state.playing = !state.playing
          updatePlayer()
        }
      })
      $('#command-dialog').addEventListener('click', (event) => {
        if (event.target === $('#command-dialog')) $('#command-dialog').close()
      })
      setInterval(() => {
        if (state.recording && !state.paused) {
          state.elapsed++
          if ($('#live-time')) $('#live-time').textContent = time(state.elapsed)
          if ($('#bar-time')) $('#bar-time').textContent = time(state.elapsed)
        }
        if (state.playing && state.page === 'detail') {
          state.time = Math.min(2536, state.time + state.speed)
          if (state.time === 2536) state.playing = false
          updatePlayer()
        }
      }, 1000)
      setTheme('system')
      render()
    </script>
  </body>
</html>
