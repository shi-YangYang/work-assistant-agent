<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>工作助手 · Spec 008 交互原型</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #eef0f5;
        --sidebar: #f4f5f8;
        --surface: #fff;
        --subtle: #f7f8fb;
        --text: #202735;
        --muted: #606b7d;
        --line: #dfe3eb;
        --control: #7b8799;
        --accent: #345bd8;
        --accent-ink: #fff;
        --selection: #e9efff;
        --positive: #267252;
        --positive-bg: #e9f5ef;
        --danger: #b63243;
        --danger-bg: #fff0f2;
        --shadow: 0 12px 44px #14264b24;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --canvas: #0c1017;
        --sidebar: #10151e;
        --surface: #181e29;
        --subtle: #1e2634;
        --text: #eef1f7;
        --muted: #a5b0c3;
        --line: #364255;
        --control: #8a98b0;
        --accent: #9ab4ff;
        --accent-ink: #132044;
        --selection: #263957;
        --positive: #86d7b0;
        --positive-bg: #193d31;
        --danger: #ffa6b2;
        --danger-bg: #412630;
        --shadow: 0 12px 44px #0006;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--canvas);
        color: var(--text);
        font:
          14px/1.65 -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif;
      }
      button,
      input,
      textarea,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      button:disabled {
        cursor: not-allowed;
        opacity: 0.5;
      }
      a {
        color: var(--accent);
      }
      button,
      input,
      textarea,
      select,
      [tabindex] {
        outline-offset: 3px;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      h1 {
        font-size: 25px;
        line-height: 1.4;
        letter-spacing: -0.6px;
        font-weight: 650;
      }
      h2 {
        font-size: 18px;
        line-height: 1.5;
      }
      h3 {
        font-size: 14px;
      }
      small,
      .small {
        font-size: 12px;
      }
      .muted {
        color: var(--muted);
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .wrap {
        flex-wrap: wrap;
      }
      .between {
        justify-content: space-between;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .stack {
        display: grid;
        gap: 16px;
      }
      .icon {
        width: 18px;
        height: 18px;
        flex-shrink: 0;
        vertical-align: middle;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 7px;
        min-height: 36px;
        padding: 7px 12px;
        border: 1px solid var(--line);
        border-radius: 7px;
        background: var(--surface);
        white-space: nowrap;
        transition: background 150ms;
      }
      .btn:hover {
        background: var(--subtle);
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-ink);
        border-color: var(--accent);
      }
      .btn.primary:hover {
        filter: brightness(0.95);
      }
      .btn.quiet {
        border-color: transparent;
        background: transparent;
      }
      .btn.quiet:hover {
        background: var(--selection);
      }
      .btn.icon-btn {
        width: 36px;
        padding: 7px;
      }
      .btn.danger {
        color: var(--danger);
      }
      .btn.small {
        padding: 3px 9px;
        min-height: 30px;
        font-size: 12px;
      }
      .text-link {
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        text-align: left;
      }
      .review-bar {
        min-height: 50px;
        padding: 8px 22px;
        display: flex;
        align-items: center;
        gap: 16px;
        border-bottom: 1px solid var(--line);
        font-size: 12px;
      }
      .review-title {
        font-weight: 600;
      }
      .review-controls {
        margin-left: auto;
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .review-bar select {
        padding: 4px 8px;
        background: var(--surface);
        border: 1px solid var(--control);
        border-radius: 6px;
        max-width: 180px;
      }
      .review-bar .btn {
        font-size: 12px;
        min-height: 30px;
      }
      .frame {
        height: calc(100dvh - 51px);
        min-height: 420px;
        width: 100%;
        container-type: inline-size;
        container-name: app;
        overflow: hidden;
        background: var(--surface);
      }
      body.phone .frame {
        width: 390px;
        max-width: 100%;
        margin: 12px auto;
        height: calc(100dvh - 76px);
        border: 1px solid var(--line);
        border-radius: 18px;
        box-shadow: var(--shadow);
      }
      .shell {
        display: grid;
        grid-template-columns: 216px minmax(0, 1fr);
        height: 100%;
      }
      .sidebar {
        display: flex;
        flex-direction: column;
        padding: 25px 14px 16px;
        background: var(--sidebar);
        border-right: 1px solid var(--line);
        min-height: 0;
      }
      .brand {
        padding: 0 6px 26px;
        font-size: 15px;
        font-weight: 650;
      }
      .brand-mark {
        display: grid;
        place-items: center;
        width: 32px;
        height: 32px;
        border-radius: 9px;
        background: var(--accent);
        color: var(--accent-ink);
      }
      .workspace-name {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 0 10px 17px;
        color: var(--muted);
        font-size: 12px;
      }
      .label {
        padding: 18px 10px 8px;
        color: var(--muted);
        font-size: 12px;
      }
      .nav {
        display: grid;
        gap: 4px;
      }
      .nav-btn {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid transparent;
        border-radius: 7px;
        background: transparent;
        text-align: left;
        color: var(--muted);
        position: relative;
      }
      .nav-btn:hover {
        background: var(--selection);
        color: var(--accent);
      }
      .nav-btn.active {
        background: var(--selection);
        color: var(--accent);
        font-weight: 600;
      }
      .nav-btn.active:before {
        content: '';
        position: absolute;
        left: 0;
        top: 10px;
        bottom: 10px;
        width: 3px;
        border-radius: 2px;
        background: var(--accent);
      }
      .count {
        margin-left: auto;
        border-radius: 5px;
        font-size: 12px;
        background: var(--surface);
        padding: 0 6px;
      }
      .sidebar-settings {
        margin-top: auto;
        padding-top: 16px;
      }
      .identity {
        border-top: 1px solid var(--line);
        margin-top: 15px;
        padding: 16px 8px 0;
      }
      .avatar {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        border-radius: 10px;
        background: var(--selection);
        color: var(--accent);
        font-weight: 600;
        flex-shrink: 0;
      }
      .main {
        display: flex;
        flex-direction: column;
        min-width: 0;
        min-height: 0;
      }
      .topbar {
        min-height: 51px;
        border-bottom: 1px solid var(--line);
        padding: 0 30px;
        font-size: 12px;
        color: var(--muted);
        flex-shrink: 0;
      }
      .topbar strong {
        color: var(--text);
        font-weight: 500;
      }
      .topbar .mobile-account {
        display: none;
      }
      .page {
        display: flex;
        flex-direction: column;
        min-height: 0;
        flex: 1;
        overflow: hidden;
      }
      .page-heading {
        padding: 28px 32px 22px;
        flex-shrink: 0;
      }
      .page-heading p {
        margin-top: 6px;
      }
      .page-body {
        padding: 0 32px 30px;
        overflow: auto;
        flex: 1;
        min-height: 0;
        scrollbar-gutter: stable;
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        white-space: nowrap;
        padding: 2px 8px;
        border-radius: 5px;
        background: var(--subtle);
        color: var(--muted);
        font-size: 12px;
      }
      .badge.blue {
        background: var(--selection);
        color: var(--accent);
      }
      .badge.green {
        background: var(--positive-bg);
        color: var(--positive);
      }
      .badge.red {
        background: var(--danger-bg);
        color: var(--danger);
      }
      .badge .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: currentColor;
      }
      .tabs {
        display: flex;
        gap: 22px;
        border-bottom: 1px solid var(--line);
        margin-bottom: 22px;
      }
      .tabs button {
        background: none;
        border: 0;
        padding: 11px 0;
        color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .tabs button.active {
        color: var(--accent);
        border-bottom-color: var(--accent);
        font-weight: 600;
      }
      .assistant-scroll {
        overflow: auto;
        flex: 1;
        min-height: 0;
        padding: 4px 32px 20px;
      }
      .conversation {
        max-width: 790px;
        margin: 0 auto;
      }
      .day {
        display: flex;
        align-items: center;
        gap: 18px;
        margin: 4px 0 25px;
        color: var(--muted);
        font-size: 12px;
      }
      .day:before,
      .day:after {
        content: '';
        height: 1px;
        background: var(--line);
        flex: 1;
      }
      .message {
        display: flex;
        gap: 12px;
        margin-bottom: 25px;
      }
      .message .avatar {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        font-size: 12px;
      }
      .message-head {
        font-size: 12px;
        margin: 2px 0 7px;
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .message-head strong {
        font-size: 13px;
      }
      .bubble {
        line-height: 1.85;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .assistant-avatar {
        background: var(--text);
        color: var(--surface);
      }
      .progress-card {
        margin-top: 14px;
        border: 1px solid var(--line);
        border-left: 3px solid var(--accent);
        border-radius: 9px;
        background: var(--surface);
        padding: 18px;
        max-width: 630px;
      }
      .progress-card .card-caption {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 10px;
      }
      .progress-card h3 {
        font-size: 15px;
      }
      .facts {
        display: grid;
        grid-template-columns: 58px minmax(0, 1fr);
        gap: 7px 15px;
        margin: 13px 0;
      }
      .facts dt {
        color: var(--muted);
        font-size: 12px;
      }
      .facts dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      .card-actions {
        padding-top: 13px;
        border-top: 1px solid var(--line);
      }
      .composer-wrap {
        padding: 10px 32px 15px;
        background: var(--surface);
      }
      .composer {
        max-width: 790px;
        margin: 0 auto;
        border: 1px solid var(--control);
        border-radius: 11px;
        background: var(--surface);
        box-shadow: 0 3px 12px #14264b08;
      }
      .composer:focus-within {
        border-color: var(--accent);
      }
      .composer textarea {
        width: 100%;
        min-height: 82px;
        max-height: 160px;
        resize: vertical;
        border: 0;
        background: transparent;
        padding: 15px 16px 7px;
        outline: none;
      }
      .composer-footer {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 10px 10px;
      }
      .privacy {
        max-width: 790px;
        margin: 7px auto 0;
        color: var(--muted);
        font-size: 12px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .privacy .icon {
        width: 13px;
        height: 13px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 5px 9px;
        margin: 7px 12px 0;
        border-radius: 6px;
        background: var(--subtle);
        font-size: 12px;
      }
      .notice {
        padding: 12px 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--subtle);
        color: var(--muted);
        font-size: 13px;
      }
      .notice.error {
        background: var(--danger-bg);
        color: var(--danger);
        border-color: var(--danger);
      }
      .filters {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }
      .search {
        display: flex;
        align-items: center;
        gap: 8px;
        border: 1px solid var(--control);
        border-radius: 7px;
        padding: 8px 11px;
        background: var(--surface);
        width: 260px;
      }
      .search input {
        border: 0;
        outline: none;
        width: 100%;
        background: none;
        min-width: 0;
      }
      .list {
        border: 1px solid var(--line);
        border-radius: 10px;
        overflow: visible;
      }
      .list-head {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 115px 125px 44px;
        gap: 12px;
        padding: 11px 17px;
        background: var(--subtle);
        border-bottom: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
        border-radius: 10px 10px 0 0;
      }
      .work-row {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 115px 125px 44px;
        gap: 12px;
        align-items: center;
        padding: 18px 17px;
        border-bottom: 1px solid var(--line);
      }
      .work-row:last-child {
        border-bottom: 0;
      }
      .work-row:hover,
      .work-row:focus-within {
        background: var(--subtle);
      }
      .work-title {
        border: 0;
        background: none;
        padding: 0;
        text-align: left;
      }
      .work-title strong {
        display: block;
        font-size: 14px;
        font-weight: 550;
      }
      .work-title p {
        margin-top: 4px;
        color: var(--muted);
        font-size: 12px;
      }
      .more-wrap {
        position: relative;
        justify-self: end;
      }
      .more-wrap .btn:hover {
        background: var(--line);
      }
      .popover {
        position: absolute;
        top: calc(100% + 5px);
        right: 0;
        min-width: 180px;
        z-index: 12;
        padding: 5px;
        border: 1px solid var(--line);
        box-shadow: var(--shadow);
        background: var(--surface);
        border-radius: 9px;
      }
      .popover:before {
        content: '';
        position: absolute;
        top: -7px;
        left: 0;
        right: 0;
        height: 8px;
      }
      .popover button {
        display: block;
        width: 100%;
        text-align: left;
        border: 0;
        background: none;
        border-radius: 5px;
        padding: 9px 10px;
        white-space: nowrap;
      }
      .popover button:hover {
        background: var(--subtle);
      }
      .metric-strip {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 24px;
        padding: 19px 0;
      }
      .metric {
        padding: 0 22px;
        border-right: 1px solid var(--line);
      }
      .metric:last-child {
        border: 0;
      }
      .metric strong {
        display: block;
        font-size: 27px;
        font-weight: 600;
        line-height: 1.5;
      }
      .metric p {
        font-size: 12px;
        color: var(--muted);
      }
      .team-row {
        display: grid;
        grid-template-columns: 170px minmax(0, 1fr) 115px 24px;
        align-items: center;
        gap: 16px;
        padding: 19px 20px;
        border-bottom: 1px solid var(--line);
        background: none;
        border-left: 0;
        border-right: 0;
        border-top: 0;
        width: 100%;
        text-align: left;
      }
      .team-row:last-child {
        border-bottom: 0;
      }
      .team-row:hover {
        background: var(--subtle);
      }
      .team-row p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 3px;
      }
      .report-layout {
        display: grid;
        grid-template-columns: 200px minmax(0, 1fr);
        gap: 24px;
      }
      .report-index {
        display: grid;
        gap: 5px;
        align-content: start;
      }
      .report-index button {
        background: none;
        border: 0;
        border-radius: 7px;
        padding: 12px;
        text-align: left;
      }
      .report-index button.active {
        background: var(--selection);
        color: var(--accent);
      }
      .report-paper {
        max-width: 820px;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 27px 30px;
      }
      .report-paper h2 {
        font-size: 21px;
        margin: 10px 0 7px;
      }
      .report-section {
        margin-top: 23px;
      }
      .report-section h3 {
        font-size: 13px;
        margin-bottom: 8px;
        color: var(--muted);
      }
      .report-section p {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      .report-meta {
        border-bottom: 1px solid var(--line);
        padding-bottom: 20px;
        margin-bottom: 22px;
      }
      .settings-panel {
        max-width: 760px;
      }
      .settings-section {
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 20px;
        padding: 22px;
      }
      .settings-section h2 {
        font-size: 16px;
        margin-bottom: 5px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }
      .field {
        display: grid;
        gap: 7px;
        font-size: 13px;
      }
      .field input,
      .field select,
      .field textarea {
        border: 1px solid var(--control);
        border-radius: 6px;
        min-height: 39px;
        padding: 8px 10px;
        background: var(--surface);
        width: 100%;
      }
      .field textarea {
        min-height: 95px;
        resize: vertical;
      }
      .theme-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 12px;
        margin-top: 18px;
      }
      .theme-option {
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: none;
        text-align: left;
      }
      .theme-option.active {
        border-color: var(--accent);
        background: var(--selection);
      }
      .theme-sample {
        height: 64px;
        border: 1px solid #7b8799;
        border-radius: 5px;
        margin-bottom: 9px;
        background: linear-gradient(90deg, #f4f5f8 28%, #fff 28%);
      }
      .theme-sample.dark {
        background: linear-gradient(90deg, #10151e 28%, #181e29 28%);
      }
      .theme-sample.system {
        background: linear-gradient(120deg, #f4f5f8 50%, #181e29 50%);
      }
      .empty {
        padding: 55px 20px;
        text-align: center;
        color: var(--muted);
      }
      .empty h2 {
        color: var(--text);
        margin-bottom: 8px;
      }
      .source-card {
        padding: 15px;
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-top: 15px;
      }
      .doc-preview {
        margin-top: 12px;
        border: 1px solid var(--line);
        padding: 15px;
        border-radius: 7px;
        background: var(--subtle);
        max-width: 350px;
      }
      .doc-lines {
        display: grid;
        gap: 7px;
        margin: 13px 0;
      }
      .doc-lines i {
        height: 6px;
        border-radius: 2px;
        background: var(--line);
      }
      .doc-lines i:nth-child(2) {
        width: 80%;
      }
      .doc-lines i:nth-child(3) {
        width: 65%;
      }
      .audio-demo {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
        padding: 10px;
        background: var(--subtle);
        border-radius: 8px;
        max-width: 330px;
      }
      .audio-demo input {
        min-width: 0;
        flex: 1;
        accent-color: var(--accent);
      }
      dialog {
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 13px;
        box-shadow: var(--shadow);
        width: min(520px, calc(100vw - 28px));
        padding: 25px;
        max-height: 85dvh;
        overflow: auto;
      }
      dialog::backdrop {
        background: #0c101766;
        backdrop-filter: blur(2px);
      }
      dialog .dialog-header {
        margin-bottom: 20px;
      }
      dialog h2 {
        font-size: 19px;
      }
      .dialog-footer {
        margin-top: 22px;
        display: flex;
        gap: 9px;
        justify-content: flex-end;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 25px;
        transform: translateX(-50%);
        padding: 11px 18px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--text);
        color: var(--surface);
        box-shadow: var(--shadow);
        font-size: 13px;
        z-index: 30;
        max-width: calc(100vw - 30px);
        text-align: center;
      }
      .command-list {
        display: grid;
        gap: 4px;
        margin-top: 13px;
      }
      .command-list button {
        border: 0;
        text-align: left;
        background: none;
        padding: 12px;
        border-radius: 6px;
      }
      .command-list button:hover {
        background: var(--selection);
      }
      [hidden] {
        display: none !important;
      }
      @container app (max-width:700px) {
        .shell {
          grid-template-columns: 1fr;
          grid-template-rows: minmax(0, 1fr) auto;
        }
        .sidebar {
          grid-row: 2;
          padding: 3px 5px max(5px, env(safe-area-inset-bottom));
          border-right: 0;
          border-top: 1px solid var(--line);
          z-index: 15;
        }
        .brand,
        .workspace-name,
        .sidebar > .btn,
        .sidebar > .label,
        .sidebar-settings,
        .identity {
          display: none;
        }
        .nav {
          display: flex;
          justify-content: space-around;
          gap: 2px;
        }
        .nav-btn {
          flex: 1;
          justify-content: center;
          flex-direction: column;
          gap: 1px;
          padding: 7px 2px 4px;
          font-size: 11px;
        }
        .nav-btn .icon {
          width: 20px;
          height: 20px;
        }
        .nav-btn.active:before,
        .nav-btn .count,
        .nav-btn[data-page='members'] {
          display: none;
        }
        .topbar {
          min-height: 45px;
          padding: 0 18px;
        }
        .topbar .mobile-account {
          display: inline-flex;
        }
        .page-heading {
          padding: 21px 19px 18px;
        }
        .page-heading h1 {
          font-size: 22px;
        }
        .page-heading .heading-action {
          font-size: 12px;
          padding: 5px 8px;
        }
        .page-heading .heading-sub {
          display: none;
        }
        .page-body {
          padding: 0 18px 20px;
        }
        .assistant-scroll {
          padding: 0 17px 13px;
        }
        .message {
          gap: 9px;
          margin-bottom: 20px;
        }
        .message .avatar {
          width: 26px;
          height: 26px;
        }
        .progress-card {
          padding: 13px;
        }
        .facts {
          grid-template-columns: 43px minmax(0, 1fr);
          gap: 6px 10px;
        }
        .composer-wrap {
          padding: 8px 13px;
        }
        .composer textarea {
          font-size: 16px;
          min-height: 65px;
          padding: 10px 12px;
        }
        .privacy {
          font-size: 11px;
          line-height: 1.45;
        }
        .privacy .icon {
          display: none;
        }
        .composer-footer .keyboard-hint {
          display: none;
        }
        .card-actions {
          flex-wrap: wrap;
        }
        .list-head {
          display: none;
        }
        .work-row {
          grid-template-columns: minmax(0, 1fr) 38px;
          gap: 8px;
          padding: 16px 13px;
        }
        .work-row > .work-status {
          grid-column: 1;
          grid-row: 2;
        }
        .work-row > .updated {
          grid-column: 1;
          grid-row: 3;
          font-size: 11px;
        }
        .work-row > .more-wrap {
          grid-column: 2;
          grid-row: 1;
        }
        .search {
          width: 100%;
        }
        .metric-strip {
          padding: 13px 0;
          gap: 0;
        }
        .metric {
          padding: 0 12px;
        }
        .metric strong {
          font-size: 22px;
        }
        .team-row {
          grid-template-columns: minmax(0, 1fr) 70px;
          gap: 10px;
          padding: 15px;
        }
        .team-row .team-summary {
          grid-row: 2;
          grid-column: 1/-1;
        }
        .team-row > .icon {
          display: none;
        }
        .team-row .badge {
          grid-column: 2;
          grid-row: 1;
        }
        .report-layout {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .report-index {
          display: flex;
          overflow: auto;
        }
        .report-index button {
          white-space: nowrap;
        }
        .report-paper {
          padding: 20px 17px;
        }
        .report-paper h2 {
          font-size: 19px;
        }
        .form-grid {
          grid-template-columns: 1fr;
          gap: 15px;
        }
        .settings-section {
          padding: 17px;
        }
        .theme-grid {
          gap: 7px;
        }
        .theme-option {
          padding: 8px;
          font-size: 12px;
        }
        .tabs {
          gap: 20px;
        }
        .source-card {
          padding: 12px;
        }
        .page-heading .row {
          flex-wrap: wrap;
        }
      }
      @media (max-width: 620px) {
        .review-bar {
          padding: 8px 10px;
          gap: 6px;
          flex-wrap: wrap;
        }
        .review-title {
          display: none;
        }
        .review-controls {
          gap: 5px;
        }
        .review-controls select {
          max-width: 124px;
        }
        .frame {
          height: calc(100dvh - 51px);
        }
        body.phone .frame {
          margin: 0 auto;
          height: calc(100dvh - 51px);
          border-radius: 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        * {
          transition: none !important;
          scroll-behavior: auto !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="review-bar">
      <span class="review-title">Spec 008 · 交互原型</span
      ><span class="muted">示例数据 · 无真实服务</span>
      <div class="review-controls">
        <label
          ><span class="sr-label" hidden>体验身份</span
          ><select id="demo-role" aria-label="体验身份">
            <option value="employee">员工 · 陈晨</option>
            <option value="admin">老板／管理员</option>
          </select></label
        ><button class="btn" data-action="device" id="device-btn">手机预览</button
        ><button class="btn" data-action="theme" id="theme-btn">主题</button>
      </div>
    </div>
    <div class="frame" id="frame">
      <div class="shell">
        <aside class="sidebar" id="sidebar"></aside>
        <main class="main">
          <div class="topbar row" id="topbar"></div>
          <section class="page" id="page"></section>
        </main>
      </div>
    </div>
    <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
    <div id="toast" class="toast" role="status" hidden></div>
    <script>
      const icons = {
        chat: 'M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5Z',
        work: 'M9 5H5v15h14V5h-4M9 3h6v4H9zM8 12l2 2 5-5M8 17h7',
        report: 'M14 2H6a2 2 0 0 0-2 2v16h16V8zM14 2v6h6M8 12h8M8 16h6',
        team: 'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8M17 4a4 4 0 0 1 0 7M22 21v-2a4 4 0 0 0-3-3.8',
        settings:
          'M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2',
        search: 'M21 21l-5-5M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14',
        arrow: 'M5 12h14M13 6l6 6-6 6',
        back: 'M19 12H5M11 6l-6 6 6 6',
        chevron: 'm9 5 7 7-7 7',
        check: 'm5 12 4 4L19 6',
        plus: 'M12 5v14M5 12h14',
        mic: 'M9 4a3 3 0 0 1 6 0v8a3 3 0 0 1-6 0zM5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8',
        paperclip: 'm21 11-8 8a6 6 0 0 1-8-8l9-9a4 4 0 0 1 6 6l-9 9a2 2 0 0 1-3-3l8-8',
        more: 'M5 12h.01M12 12h.01M19 12h.01',
        close: 'M6 6l12 12M18 6 6 18',
        sun: 'M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1 1M18 18l1 1M5 19l1-1M18 6l1-1M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10',
        eye: 'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12M12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',
        refresh: 'M20 7v5h-5M4 17v-5h5M6 6a8 8 0 0 1 13 3M18 18a8 8 0 0 1-13-3',
        play: 'm8 5 11 7-11 7z',
        edit: 'm15 4 5 5M4 20l4-1L21 6l-5-5L3 14z',
        calendar: 'M4 5h16v16H4zM4 10h16M8 2v6M16 2v6',
        logout: 'M10 4H4v16h6M14 8l4 4-4 4M8 12h10',
      }
      const icon = (name) =>
        `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${icons[name] || icons.work}"/></svg>`
      const esc = (v) =>
        String(v ?? '').replace(
          /[&<>"']/g,
          (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c],
        )
      const badge = (text, kind = '') =>
        `<span class="badge ${kind}"><span class="dot"></span>${esc(text)}</span>`
      const btn = (text, action, cls = '', id = '') =>
        `<button class="btn ${cls}" data-action="${action}" ${id ? `data-id="${id}"` : ''}>${text}</button>`
      const state = {
        role: 'employee',
        page: 'assistant',
        theme: localStorage.getItem('paa.spec008.theme') || 'system',
        pending: true,
        recording: false,
        voice: false,
        attachment: false,
        draft: '',
        reportTab: 'daily',
        personTab: 'progress',
        reportPublished: false,
        reportEdited: false,
        failNext: false,
        offline: false,
        filter: '',
        person: '陈晨',
        scroll: {},
        messages: [],
        work: [
          {
            id: 'w1',
            title: '华远客户 · 第二版方案',
            text: '已完成需求梳理，正在完善方案初稿',
            status: '进行中',
            next: '整理报价与交付计划',
          },
          {
            id: 'w2',
            title: '官网改版 · 首屏设计',
            text: '已交付首屏设计与交互说明',
            status: '已完成',
            next: '跟进开发反馈',
          },
        ],
        reportText:
          '已完成华远客户需求梳理，正在完善方案初稿。\n官网首屏设计已交付，并同步了交互说明。',
        members: [
          { name: '陈晨', title: '产品与客户方案', status: '有更新' },
          { name: '林悦', title: '品牌与内容设计', status: '有更新' },
          { name: '李明', title: '商务与客户支持', status: '暂无上报' },
        ],
        ruleDraft: null,
        rules: {
          daily: true,
          weekly: true,
          days: '每天',
          day: '星期五',
          generate: '17:30',
          deadline: '18:00',
          weeklyGenerate: '17:30',
          weeklyDeadline: '18:00',
          timezone: 'Asia/Shanghai',
        },
      }
      const labels = {
        assistant: '工作助手',
        work: '我的工作',
        reports: '我的报告',
        team: '团队看板',
        person: '员工详情',
        members: '成员管理',
        rules: '汇报规则',
        appearance: '外观',
        account: '账户',
      }
      let toastTimer,
        priorFocus,
        voiceTimer,
        playTime = 0,
        returnPage = 'assistant'
      function toast(text) {
        const el = document.querySelector('#toast')
        el.textContent = text
        el.hidden = false
        clearTimeout(toastTimer)
        toastTimer = setTimeout(() => (el.hidden = true), 3200)
      }
      function applyTheme() {
        const dark =
          state.theme === 'dark' ||
          (state.theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        localStorage.setItem('paa.spec008.theme', state.theme)
        document.querySelector('#theme-btn').textContent = {
          system: '跟随系统',
          light: '浅色',
          dark: '深色',
        }[state.theme]
      }
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme)
      function navigate(page, push = true) {
        const scroll = document.querySelector('.page-body,.assistant-scroll')
        if (scroll) state.scroll[state.page] = scroll.scrollTop
        if (state.recording) {
          state.recording = false
          state.voice = true
          toast('录制已结束，示例语音保留在输入区')
        }
        clearInterval(voiceTimer)
        document.querySelectorAll('.popover').forEach((e) => e.remove())
        state.page = page
        if (push) history.pushState({ page }, '', `#${page}`)
        render()
        requestAnimationFrame(() => {
          const el = document.querySelector('.page-body,.assistant-scroll')
          if (el) el.scrollTop = state.scroll[page] || 0
          document.querySelector('#page-title')?.focus({ preventScroll: true })
        })
      }
      function sidebar() {
        const admin = state.role === 'admin'
        const primary = [
          ['assistant', 'chat'],
          ['work', 'work'],
          ['reports', 'report'],
          ...(admin
            ? [
                ['team', 'team'],
                ['members', 'team'],
              ]
            : []),
        ]
        const settings = [
          ...(admin ? [['rules', 'calendar']] : []),
          ['appearance', 'sun'],
          ['account', 'settings'],
        ]
        const nav = ([page, i]) =>
          `<button class="nav-btn ${state.page === page || (state.page === 'person' && page === 'team') ? 'active' : ''}" data-page="${page}" ${state.page === page ? 'aria-current="page"' : ''}>${icon(i)}<span>${labels[page]}</span>${page === 'work' && state.pending ? '<span class="count">1</span>' : ''}</button>`
        document.querySelector('#sidebar').innerHTML =
          `<div class="brand row"><span class="brand-mark">${icon('chat')}</span>个人工作助手</div><div class="workspace-name">示例公司 <span class="badge">工作空间</span></div>${btn(icon('search') + '查找页面与操作', 'commands', 'small')}<div class="label">工作空间</div><nav class="nav" aria-label="主导航">${primary.map(nav).join('')}</nav><div class="sidebar-settings"><div class="label">设置</div><nav class="nav" aria-label="设置导航">${settings.map(nav).join('')}</nav></div><div class="identity row"><div class="avatar">${admin ? '管' : '陈'}</div><div><strong>${admin ? '管理员' : '陈晨'}</strong><p class="muted small">${admin ? '老板／管理员' : '员工'}</p></div></div>`
        document.querySelector('#topbar').innerHTML =
          `<span>${settings.some(([p]) => p === state.page) ? '设置' : '工作空间'}</span>${icon('chevron')}<strong>${labels[state.page]}</strong><span class="grow"></span>${btn(icon('settings'), 'mobile-menu', 'quiet icon-btn mobile-account')}`
      }
      const heading = (title, sub = '', action = '') =>
        `<header class="page-heading row between"><div><h1 id="page-title" tabindex="-1">${title}</h1>${sub ? `<p class="muted small heading-sub">${sub}</p>` : ''}</div>${action}</header>`
      function progressCard() {
        if (!state.pending)
          return `<div class="progress-card"><div class="row between"><strong class="row">${icon('check')}已更新到我的工作</strong>${badge('已确认', 'green')}</div><p class="small muted" style="margin:9px 0">华远客户方案 · 初稿完成，等待报价</p>${btn('查看工作记录 ' + icon('arrow'), 'go-work', 'quiet small')}</div>`
        return `<div class="progress-card"><div class="card-caption row between"><span>工作进展</span>${badge('待你确认', 'blue')}</div><h3>华远客户 · 第二版方案</h3><dl class="facts"><dt>已完成</dt><dd>方案初稿，含交付范围和实施计划</dd><dt>当前阻碍</dt><dd>等待李明提供报价</dd><dt>下一步</dt><dd>收到报价后完善方案并发给客户</dd></dl><div class="card-actions row">${btn(icon('check') + '确认进展', 'confirm', 'primary')}${btn('修改', 'edit-progress')}${btn('查看来源', 'source', 'quiet small')}</div></div>`
      }
      const message = (name, time, body, assistant = false) =>
        `<div class="message"><div class="avatar ${assistant ? 'assistant-avatar' : ''}">${assistant ? icon('chat') : '陈'}</div><div class="grow"><div class="message-head"><strong>${name}</strong><span class="muted">${time}</span></div>${body}</div></div>`
      function assistant() {
        const samples = state.messages
          .map((m) =>
            message(
              m.assistant ? '工作助手' : '陈晨',
              '刚刚',
              `<p class="bubble">${esc(m.text)}</p>${m.failed ? `<div class="notice error">发送失败，内容已保留。 ${btn('重试', 'retry-message', 'small')}</div>` : ''}`,
              m.assistant,
            ),
          )
          .join('')
        return (
          heading(
            '工作助手',
            '记录一点进展，接着上次的工作继续。',
            btn(icon('more'), 'assistant-options', 'quiet icon-btn'),
          ) +
          `<div class="assistant-scroll"><div class="conversation"><div class="day">9 月 12 日 · 星期六</div>${state.offline ? '<div class="notice error" style="margin-bottom:18px">连接已断开，已保存的记录仍可阅读。</div>' : ''}${message('陈晨', '15:42', '<p class="bubble">华远的方案初稿写好了，交付范围和实施计划都补进去了。<br>报价还没拿到，等李明下午给我，拿到后就能发给客户。</p>')}${message('工作助手', '15:42', '<p>这条进展关联到「华远客户 · 第二版方案」。我整理了完成内容和当前阻碍，你可以确认或修改。</p>' + progressCard(), true)}${samples}</div></div><div class="composer-wrap"><div class="composer">${state.attachment ? `<div class="chip">${icon('report')}方案初稿.png · 示例 ${btn('×', 'remove-attachment', 'quiet small')}</div>` : ''}${state.voice ? `<div class="chip">${icon('mic')}语音消息 · 00:18 · 示例 ${btn('试听', 'listen', 'quiet small')}${btn('×', 'remove-voice', 'quiet small')}</div>` : ''}<textarea id="message-input" aria-label="工作消息" placeholder="发一条工作进展，或继续补充…">${esc(state.draft)}</textarea><div class="composer-footer">${btn(icon('paperclip'), 'attach', 'quiet icon-btn')}${btn(icon(state.recording ? 'close' : 'mic'), 'voice', 'quiet icon-btn')}<span class="small muted">${state.recording ? '录制示例中… 点击停止' : ''}</span><span class="grow"></span><span class="small muted keyboard-hint">⌘ / Ctrl + Enter 发送</span>${btn(icon('arrow'), 'send', 'primary icon-btn')}</div></div><p class="privacy">${icon('eye')}发送后的工作消息及附件，老板／管理员可查看</p></div>`
        )
      }
      function workRows() {
        return (
          state.work
            .filter((w) => (w.title + w.text).includes(state.filter))
            .map(
              (w) =>
                `<div class="work-row"><button class="work-title" data-action="work-detail" data-id="${w.id}"><strong>${esc(w.title)}</strong><p>${esc(w.text)}</p></button><div class="work-status">${badge(w.status, w.status === '已完成' ? 'green' : w.status === '受阻' ? 'red' : 'blue')}</div><span class="muted small updated">今天 · 15:42</span><div class="more-wrap">${btn(icon('more'), 'more', 'quiet icon-btn', w.id)}</div></div>`,
            )
            .join('') || '<div class="empty">没有匹配的工作记录</div>'
        )
      }
      function work() {
        return (
          heading(
            '我的工作',
            '陈晨 · 已确认的工作记录',
            btn(icon('plus') + '补充进展', 'edit-progress', 'heading-action'),
          ) +
          `<div class="page-body">${state.pending ? `<div class="notice row between" style="margin-bottom:20px"><span>工作助手整理了 1 条待确认进展</span>${btn('去确认', 'go-assistant', 'small')}</div>` : ''}<div class="filters"><label class="search">${icon('search')}<input aria-label="搜索工作" id="work-search" placeholder="查找工作事项…" value="${esc(state.filter)}"></label><span class="grow"></span><span class="muted small">${state.work.length} 项工作</span></div><div class="list"><div class="list-head"><span>工作事项</span><span>状态</span><span>最近更新</span><span></span></div><div id="work-rows">${workRows()}</div></div></div>`
        )
      }
      function reportPaper(readOnly = false) {

            openDialog(
              state.reportPublished ? '更正已提交报告' : '编辑报告草稿',
              `<label class="field">完成的工作<textarea id="report-editor" style="min-height:170px">${esc(state.reportText)}</textarea></label><p class="small muted" style="margin-top:12px">${state.reportPublished ? '保存后形成新的报告修订。' : '保存后仍为草稿，提交前仅你可见。'}</p>`,
              btn('取消', 'close-dialog') + btn('保存修改', 'save-report', 'primary'),
            )
            break
          case 'save-report':
            if (!document.querySelector('#report-editor').value.trim()) {
              toast('报告内容不能为空')
              break
            }
            state.reportText = document.querySelector('#report-editor').value
            state.reportEdited = true
            closeDialog()
            render()
            toast('报告修改已保存')
            break
          case 'publish':
            if (state.reportPublished) {
              toast('已提交，可通过更正报告更新')
              break
            }
            openDialog(
              '提交这份报告？',
              '<p>提交后，老板／管理员可以查看这份报告及关联工作记录。</p>',
              btn('继续编辑', 'close-dialog') + btn('确认提交', 'confirm-publish', 'primary'),
            )
            break
          case 'confirm-publish':
            state.reportPublished = true
            closeDialog()
            render()
            toast('报告已提交（示例）')
            break
          case 'view-rules':
            openDialog(
              '我的汇报安排',
              `<dl class="facts"><dt>日报</dt><dd>${esc(state.rules.days)} · ${esc(state.rules.deadline)} 前</dd><dt>周报</dt><dd>${esc(state.rules.day)} · ${esc(state.rules.weeklyDeadline)} 前</dd><dt>时区</dt><dd>中国标准时间（UTC+8）</dd></dl><p class="small muted">由管理员统一设置。生成草稿后，需要你审阅并提交。</p>`,
            )
            break
          case 'past-report':
            openDialog(
              '已提交的报告',
              '<p>已完成客户需求梳理和首页设计评审，下一步完善方案初稿。</p><p class="small muted" style="margin-top:16px">历史报告示例 · 保留提交时内容</p>',
            )
            break
          case 'person':
            state.person = id
            state.personTab = 'progress'
            navigate('person')
            break
          case 'person-tab':
            state.personTab = id
            render()
            break
          case 'refresh':
            document.querySelector('#updated-at').textContent = '刚刚更新'
            toast('已更新示例看板')
            break
          case 'team-period':
            openDialog(
              '查看时间范围',
              '<div class="command-list">' +
                btn('今天 · 9 月 12 日', 'close-dialog') +
                btn('本周 · 9 月 7 — 13 日', 'period-week') +
                '</div>',
            )
            break
          case 'period-week':
            closeDialog()
            toast('原型展示本周的同一组示例记录')
            break
          case 'save-rules': {
            let valid = true
            document.querySelectorAll('[data-rule]').forEach((el) => {
              if (el.type === 'time' && !el.value) valid = false
            })
            if (!valid) {
              toast('请补齐生成和提交时间')
              break
            }
            document
              .querySelectorAll('[data-rule]')
              .forEach(
                (el) =>
                  (state.rules[el.dataset.rule] = el.type === 'checkbox' ? el.checked : el.value),
              )
            state.ruleDraft = null
            toast('汇报规则已保存，将用于后续周期（示例）')
            break
          }
          case 'add-member':
            openDialog(
              '添加员工',
              `<div class="stack"><label class="field">姓名<input id="member-name" placeholder="员工姓名"></label><label class="field">登录账号<input id="member-login" placeholder="由管理员分配"></label><p class="small muted">角色：员工 · 此原型只添加示例记录</p></div>`,
              btn('取消', 'close-dialog') + btn('添加员工', 'save-member', 'primary'),
            )
            break
          case 'save-member': {
            const name = document.querySelector('#member-name').value.trim()
            if (!name || !document.querySelector('#member-login').value.trim()) {
              toast('请填写姓名和登录账号')
              break
            }
            state.members.push({ name, title: '员工', status: '暂无上报' })
            closeDialog()
            render()
            toast('已添加示例员工')
            break
          }
          case 'member-menu':
            openDialog(
              '成员操作',
              `<p>${esc(state.members[Number(id)].name)} · 员工</p>`,
              btn('取消', 'close-dialog') +
                btn(
                  state.members[Number(id)].disabled ? '恢复账号' : '停用账号',
                  'toggle-member',
                  '',
                  id,
                ),
            )
            break
          case 'toggle-member':
            state.members[Number(id)].disabled = !state.members[Number(id)].disabled
            closeDialog()
            render()
            toast('成员状态已更新（示例）')
            break
          case 'password':
            openDialog(
              '修改密码',
              '<p>正式版本将支持校验当前密码并设置新密码。此原型不接收或保存真实密码。</p>',
            )
            break
          case 'logout':
            openDialog(
              '退出登录',
              '<p>此处为原型演示。正式版本会结束当前会话并清除本机账号缓存。</p>',
              btn('返回', 'close-dialog'),
            )
            break
          case 'more': {
            document.querySelectorAll('.popover').forEach((x) => x.remove())
            const wrap = b.closest('.more-wrap')
            wrap.insertAdjacentHTML(
              'beforeend',
              `<div class="popover" role="menu">${btn('查看工作记录', 'work-detail', '', id)}${btn('更新进展', 'edit-progress', '', id)}${btn('查看原始来源', 'source')}</div>`,
            )
            const menu = wrap.querySelector('.popover')
            if (
              menu.getBoundingClientRect().bottom >
              document.querySelector('#frame').getBoundingClientRect().bottom - 30
            ) {
              menu.style.top = 'auto'
              menu.style.bottom = 'calc(100% + 5px)'
            }
            wrap.onmouseleave = () => {
              if (!wrap.querySelector(':focus-visible')) menu.remove()
            }
            menu.querySelectorAll('button').forEach((x) => x.setAttribute('role', 'menuitem'))
            break
          }
        }
      })
      document.addEventListener('keydown', (e) => {
        if (e.isComposing) return
        if (
          (e.metaKey || e.ctrlKey) &&
          e.key.toLowerCase() === 'k' &&
          !['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)
        ) {
          e.preventDefault()
          commands()
        }
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter' && e.target.id === 'message-input') {
          e.preventDefault()
          send()
        }
        if (e.key === 'Escape') {
          document.querySelectorAll('.popover').forEach((m) => {
            const trigger = m.parentElement.querySelector('button')
            m.remove()
            trigger?.focus()
          })
        }
      })
      document.querySelector('#dialog').addEventListener('cancel', (e) => {
        e.preventDefault()
        closeDialog()
      })
      document.querySelector('#dialog').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
          const r = e.currentTarget.getBoundingClientRect()
          if (
            e.clientX < r.left ||
            e.clientX > r.right ||
            e.clientY < r.top ||
            e.clientY > r.bottom
          )
            closeDialog()
        }
      })
      document.querySelector('#demo-role').addEventListener('change', (e) => {
        state.role = e.target.value
        closeDialog()
        navigate(state.role === 'admin' ? 'team' : 'assistant')
        toast('已切换体验身份，数据均为演示内容')
      })
      window.addEventListener('popstate', () => {
        const page = location.hash.slice(1)
        navigate(labels[page] ? page : 'assistant', false)
      })
      applyTheme()
      state.page = labels[location.hash.slice(1)] ? location.hash.slice(1) : 'assistant'
      render()
    </script>
  </body>
</html>
